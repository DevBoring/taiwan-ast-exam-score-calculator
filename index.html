<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分科測驗目標分數落點計算器</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8 px-4 font-sans text-gray-800">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-3xl font-bold text-center text-blue-900 mb-6">🎯 分科測驗目標分數落點計算器</h1>
        
        <div class="bg-blue-50 p-4 rounded-lg mb-6">
            <h2 class="text-lg font-semibold text-blue-800 mb-3">📋 第一步：輸入你已知的考科分數（1-60級分）</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">國文 (學測)</label>
                    <input type="number" id="score-國" min="1" max="60" placeholder="未考可留空" class="mt-1 block w-full p-2 border border-gray-300 rounded bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">英文 (學測)</label>
                    <input type="number" id="score-英" min="1" max="60" placeholder="未考可留空" class="mt-1 block w-full p-2 border border-gray-300 rounded bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">數A (學測)</label>
                    <input type="number" id="score-數A" min="1" max="60" placeholder="未考可留空" class="mt-1 block w-full p-2 border border-gray-300 rounded bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">數B (學測)</label>
                    <input type="number" id="score-數B" min="1" max="60" placeholder="未考可留空" class="mt-1 block w-full p-2 border border-gray-300 rounded bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">社會 (學測)</label>
                    <input type="number" id="score-社" min="1" max="60" placeholder="未考可留空" class="mt-1 block w-full p-2 border border-gray-300 rounded bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">自然 (學測)</label>
                    <input type="number" id="score-自" min="1" max="60" placeholder="未考可留空" class="mt-1 block w-full p-2 border border-gray-300 rounded bg-white">
                </div>
            </div>
            <p class="text-xs text-gray-500 mt-2">※ 註：分科測驗科目（如數甲、物、化、生、歷、地、公）因目前未知分數，系統會自動在下方為你計算出它們「平均需要考幾級分」。</p>
        </div>

        <div class="mb-6 flex flex-col sm:flex-row gap-4 items-end">
            <div class="flex-1 w-full">
                <label class="block text-sm font-medium text-gray-700 mb-1">🔍 輸入校系代碼或關鍵字（例如: 0013 或 臺灣大學）</label>
                <input type="text" id="search-input" placeholder="請輸入..." class="w-full p-3 border border-gray-300 rounded shadow-sm bg-white text-lg">
            </div>
            <button id="search-btn" class="w-full sm:w-auto bg-blue-900 hover:bg-blue-800 text-white font-semibold px-6 py-3 rounded shadow transition">
                開始查詢
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-200 shadow-sm rounded-lg overflow-hidden">
                <thead>
                    <tr class="bg-blue-900 text-white text-sm">
                        <th class="p-3 border text-left min-w-[200px]">校系 (代碼)</th>
                        <th class="p-3 border">年度</th>
                        <th class="p-3 border">最低錄取</th>
                        <th class="p-3 border text-left">官方採計與加權</th>
                        <th class="p-3 border">扣除已知後所需總分</th>
                        <th class="p-3 border bg-orange-600">剩餘單科平均所需</th>
                        <th class="p-3 border text-left">同分參酌 / 備註</th>
                    </tr>
                </thead>
                <tbody id="result-tbody" class="text-center text-sm divide-y divide-gray-200">
                    <tr>
                        <td colspan="7" class="p-8 text-gray-400 bg-gray-50">請在上方輸入關鍵字並點擊查詢</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
